# Blueprint do Render para o backend KaveliPay.
# Neon fica fora deste arquivo: o DATABASE_URL é segredo e é colado no painel.
#
# Passos: crie o Postgres no Neon, copie a connection string com
# `?sslmode=require`, suba este blueprint e preencha as variáveis marcadas
# com `sync: false`. O Render injeta `PORT`; o backend lê essa variável.
services:
  - type: web
    name: kavelipay-backend
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4.1-flash-1017:floor
      # Mercado Pago: cobrança real do Premium e "conectar minha conta".
      # Os segredos são preenchidos no painel (sync: false). Para testar em vez
      # de vender, use um token TEST- no MP_ACCESS_TOKEN: o sandbox é derivado
      # do prefixo, não há flag para esquecer ligada.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_NOTIFICATION_URL
        value: https://kavelipay-backend.onrender.com/webhooks/mercadopago
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_TOKEN_KEY
        sync: false
      - key: DB_MAX_CONNECTIONS
        value: "10"
      - key: RUST_LOG
        value: info
